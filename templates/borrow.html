{% extends "base.html" %}

{% block title %}借阅管理 - 图书馆借阅管理系统{% endblock %}
{% block page_title %}借阅管理{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <i class="bi bi-bookmark-plus"></i> 新增借阅
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="user_id" class="form-label">选择用户</label>
                            <select class="form-select" id="user_id" name="user_id" required>
                                <option value="">-- 请选择用户 --</option>
                                {% for user in users %}
                                <option value="{{ user.id }}">{{ user.name }} ({{ user.username }}) - {{ '教师' if user.user_type == 'teacher' else '学生' }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="book_id" class="form-label">选择图书</label>
                            <select class="form-select" id="book_id" name="book_id" required>
                                <option value="">-- 请选择图书 --</option>
                                {% for book in books %}
                                <option value="{{ book.id }}">{{ book.title }} (可借: {{ book.available_copies }})</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                    <div class="mb-3">
                        <small class="text-muted">
                            <i class="bi bi-info-circle"></i> 
                            借阅规则：教师可借30天，学生可借14天。逾期每天罚款0.5元。
                        </small>
                    </div>
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-circle"></i> 确认借阅
                    </button>
                </form>
            </div>
        </div>
    </div>
    
    <div class="col-md-4">
        <div class="card">
            <div class="card-header">
                <i class="bi bi-info-circle"></i> 借阅说明
            </div>
            <div class="card-body">
                <ul class="list-unstyled">
                    <li class="mb-2">
                        <i class="bi bi-check-circle text-success"></i> 
                        教师最长借阅30天
                    </li>
                    <li class="mb-2">
                        <i class="bi bi-check-circle text-success"></i> 
                        学生最长借阅14天
                    </li>
                    <li class="mb-2">
                        <i class="bi bi-exclamation-triangle text-warning"></i> 
                        逾期每天罚款0.5元
                    </li>
                    <li class="mb-2">
                        <i class="bi bi-check-circle text-success"></i> 
                        还书时自动计算罚款
                    </li>
                </ul>
            </div>
        </div>
    </div>
</div>
{% endblock %}
