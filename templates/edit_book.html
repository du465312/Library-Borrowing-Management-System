{% extends "base.html" %}

{% block title %}编辑图书 - 图书馆借阅管理系统{% endblock %}
{% block page_title %}编辑图书{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-8">
        <div class="card">
            <div class="card-body">
                <form method="POST">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="isbn" class="form-label">ISBN</label>
                            <input type="text" class="form-control" id="isbn" name="isbn" value="{{ book.isbn }}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="title" class="form-label">书名</label>
                            <input type="text" class="form-control" id="title" name="title" value="{{ book.title }}" required>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="author" class="form-label">作者</label>
                            <input type="text" class="form-control" id="author" name="author" value="{{ book.author }}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="publisher" class="form-label">出版社</label>
                            <input type="text" class="form-control" id="publisher" name="publisher" value="{{ book.publisher }}">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label for="publish_date" class="form-label">出版日期</label>
                            <input type="text" class="form-control" id="publish_date" name="publish_date" value="{{ book.publish_date }}" placeholder="YYYY-MM">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="category" class="form-label">分类</label>
                            <input type="text" class="form-control" id="category" name="category" value="{{ book.category }}">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="total_copies" class="form-label">总数量</label>
                            <input type="number" class="form-control" id="total_copies" name="total_copies" value="{{ book.total_copies }}" min="1" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">可借数量</label>
                        <input type="text" class="form-control" value="{{ book.available_copies }}" disabled>
                        <small class="text-muted">可借数量根据借阅记录自动计算</small>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-circle"></i> 更新
                        </button>
                        <a href="/books" class="btn btn-secondary">
                            <i class="bi bi-arrow-left"></i> 返回
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
